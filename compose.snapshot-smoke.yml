services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.17
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - path.repo=/snapshots
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "127.0.0.1:19200:9200"
    volumes:
      - snapshot-smoke-data:/usr/share/elasticsearch/data
      - ${SNAPSHOT_SMOKE_DIR:?SNAPSHOT_SMOKE_DIR is required}:/snapshots
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 60

volumes:
  snapshot-smoke-data:
